name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-core-${{ runner.os }}-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-core-${{ runner.os }}-

      - name: Build FSharp.Wasm.Core
        run: dotnet build FSharp.Wasm.Core/FSharp.Wasm.Core.fsproj -c Release

      - name: Run Expecto tests
        run: dotnet test tests/FSharp.WasmCore.Tests/FSharp.WasmCore.Tests.fsproj -c Release --logger "console;verbosity=normal"

  # The standard libraries beside the base library — FSharp.Wasm.Data (JSON, numbers) and FSharp.Wasm.Ui (typed CSS and HTML, the email grid) —
  # tested under .NET.  The WebAssembly GC run of the same suites is a gate of the compiler's CI (tests/run-all.sh, suite `core-libs`).
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test framework (submodule)
        run: git submodule update --init lib/wasmecto
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Suites under .NET
        run: bash build/test.sh dotnet
